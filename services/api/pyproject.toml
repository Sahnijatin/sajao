[project]
name = "sajao-api"
version = "0.0.0"
description = "Sajao API: FastAPI modular monolith"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "boto3>=1.40",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
    "pydantic-settings>=2.11",
    "structlog>=25.4",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sajao_api"]
