[project]
name = "sajao-gateway"
version = "0.0.0"
description = "Sajao model gateway: the one path every model call goes through"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sajao_gateway"]
