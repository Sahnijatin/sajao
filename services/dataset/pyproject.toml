[project]
name = "sajao-dataset"
version = "0.0.0"
description = "Sajao detector dataset pipeline: find, screen, download, sample, label, version"
requires-python = ">=3.13"
dependencies = [
    "google-auth[requests]>=2.40",
    "httpx>=0.28",
    "numpy>=2.2",
    "opencv-python-headless>=4.10",
    "pydantic>=2.12",
    "sajao-gateway",
    "sajao-workers",
    "yt-dlp[default,deno]==2026.10.26",
]

[tool.uv.sources]
sajao-gateway = { workspace = true }
sajao-workers = { workspace = true }

[project.scripts]
sajao-dataset = "sajao_dataset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sajao_dataset"]
