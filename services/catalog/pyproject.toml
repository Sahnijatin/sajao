[project]
name = "sajao-catalog"
version = "0.0.0"
description = "Sajao catalog: one ingest path for curated products and retailer feeds"
requires-python = ">=3.13"
dependencies = ["sajao-schemas"]

[project.scripts]
sajao-catalog = "sajao_catalog.cli:main"

[tool.uv.sources]
sajao-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sajao_catalog"]
