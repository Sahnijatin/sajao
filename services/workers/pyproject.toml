[project]
name = "sajao-workers"
version = "0.0.0"
description = "Sajao workers: durable pipeline steps"
requires-python = ">=3.13"
dependencies = ["sajao-gateway", "numpy>=2.1", "pillow>=11.0"]

[tool.uv.sources]
sajao-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sajao_workers"]
