[project]
name = "sajao-workers"
version = "0.0.0"
description = "Sajao workers: durable pipeline steps"
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.8.0",
    "google-auth[requests]>=2.40",
    "httpx>=0.28",
    "numpy>=2.1",
    "pillow>=11.0",
    "sajao-catalog",
    "sajao-gateway",
    "sajao-schemas",
]

[tool.uv.sources]
sajao-catalog = { workspace = true }
sajao-gateway = { workspace = true }
sajao-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sajao_workers"]
