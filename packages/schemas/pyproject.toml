[project]
name = "sajao-schemas"
version = "0.0.0"
description = "Sajao contract: Pydantic models generated from the JSON schemas"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/sajao_schemas"]
