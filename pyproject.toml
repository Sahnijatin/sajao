[project]
name = "sajao"
version = "0.0.0"
description = "Sajao Python workspace root"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.35",
    "httpx>=0.28",
    "jsonschema>=4.25",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "types-jsonschema>=4.25",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/schemas", "services/api", "services/gateway", "services/workers"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude", "**/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["sajao_api", "sajao_gateway", "sajao_schemas", "sajao_workers"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages/schemas/python", "services"]
exclude = ["/generated/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
