[project]
name = "sajao"
version = "0.0.0"
description = "Sajao Python workspace root"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.35",
    "httpx>=0.28",
    "jsonschema>=4.25",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "types-jsonschema>=4.25",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/schemas",
    "services/api",
    "services/gateway",
    "services/workers",
    "services/spikes/twin-risk",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude", "**/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["sajao_api", "sajao_gateway", "sajao_schemas", "sajao_workers", "twin_risk"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# One-off GPU jobs: they shell out to curl, unzip, ffmpeg and splat-transform with fixed arguments.
"services/spikes/twin-risk/gpu/**" = ["S603", "S607", "S108", "E501"]
"services/spikes/twin-removal/gpu/**" = ["E501"]
"services/spikes/twin-depth/gpu/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages/schemas/python", "services"]
# GPU jobs import CUDA libraries that only exist in the Modal image.
exclude = [
    "/generated/",
    "services/spikes/twin-risk/gpu/",
    "services/spikes/twin-removal/gpu/",
    "services/spikes/twin-depth/gpu/",
    "services/workers/gpu/",
]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
